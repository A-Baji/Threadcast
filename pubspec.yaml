name: threadcast
description: Reddit posts converted to on-device AI podcasts
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^17.0.0

  # Networking
  dio: ^5.4.0

  # Reddit OAuth
  flutter_web_auth_2: ^5.0.1
  flutter_secure_storage: ^10.0.0

  # TTS
  sherpa_onnx: ^1.12.0

  # Audio
  just_audio: ^0.10.5
  ffmpeg_kit_flutter: ^6.0.3

  # Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.0

  # Sharing & export
  share_plus: ^12.0.1

  # Utilities
  uuid: ^4.3.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  isar_generator: ^3.1.0
  flutter_lints: ^4.0.0
  analyzer: ^5.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/tts_models/kokoro-v0_19.onnx
    - assets/tts_models/voices.bin
    - assets/tts_models/tokens.txt
    - assets/tts_models/espeak-ng-data/